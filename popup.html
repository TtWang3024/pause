<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hold to Pause</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span id="title">Hold to Pause</span>
    <button id="open-settings" title="Open settings" aria-label="Settings">
      <span class="ico-settings" aria-hidden="true"></span>
    </button>
  </header>

  <main>
    <p id="current-url"></p>

    <label class="group-row">
      <span>Add to</span>
      <select id="group-select"></select>
    </label>

    <button id="block-domain" class="primary">
      Block this domain
      <span class="target" id="domain-target"></span>
    </button>

    <div class="section-block">
      <input
        type="text"
        id="section-input"
        class="section-input"
        spellcheck="false"
        autocomplete="off"
        placeholder="domain.com/path"
      />
      <button id="block-section" class="primary">
        Block this section
      </button>
    </div>

    <p id="status"></p>

    <!-- The back door: blocking off for an hour, two taps, with today's count first. -->
    <section id="snooze">
      <div id="snooze-idle">
        <button id="snooze-ask" type="button" class="quiet">Pause blocking for 1 hour</button>
      </div>
      <div id="snooze-confirm" hidden>
        <p class="sz-lead">This would be your</p>
        <p id="sz-ordinal"></p>
        <p class="sz-lead">pause today</p>
        <div id="sz-dots"></div>
        <p id="sz-cost"></p>

        <!-- Before it turns off: breathe, then feel your feet. -->
        <div id="sz-breath" class="sz-step">
          <div id="sz-ball"></div>
          <p id="sz-breath-cue" class="sz-cue">Breathe in…</p>
          <p id="sz-breath-count" class="sz-sub"></p>
        </div>
        <div id="sz-feet" class="sz-step" hidden>
          <p class="sz-cue">Press both feet into the floor.</p>
          <button id="sz-feet-hold" type="button"><span id="sz-feet-fill"></span><span id="sz-feet-label">Hold while you feel them</span></button>
        </div>

        <div class="snooze-row">
          <button id="snooze-cancel" type="button" class="quiet">Cancel</button>
          <button id="snooze-yes" type="button" class="warn" disabled>Yes, pause</button>
        </div>
      </div>
      <div id="snooze-on" hidden>
        <p id="snooze-left" class="snooze-line"></p>
        <p id="snooze-today" class="snooze-note"></p>
        <button id="snooze-off" type="button" class="primary-solid">Turn back on now</button>
      </div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
