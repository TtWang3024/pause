<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hold to Pause</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span id="title">Hold to Pause</span>
    <button id="open-settings" title="Open settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <main>
    <p id="current-url"></p>

    <label class="group-row">
      <span>Add to</span>
      <select id="group-select"></select>
    </label>

    <button id="block-domain" class="primary">
      Block this domain
      <span class="target" id="domain-target"></span>
    </button>

    <div class="section-block">
      <input
        type="text"
        id="section-input"
        class="section-input"
        spellcheck="false"
        autocomplete="off"
        placeholder="domain.com/path"
      />
      <button id="block-section" class="primary">
        Block this section
      </button>
    </div>

    <p id="status"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
