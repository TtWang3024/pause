<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>A moment of magic</title>
  <link rel="stylesheet" href="reflect.css" />
</head>
<body>
  <canvas id="trail"></canvas>
  <canvas id="skymap"></canvas>
  <div id="tooltip" class="hidden"></div>

  <div id="window-toggle">
    <button class="win-btn" data-m="1" type="button">1 month</button>
    <button class="win-btn" data-m="6" type="button">6 months</button>
  </div>

  <main id="stage">
    <p id="heading">Your sky of reflections.</p>
    <div id="bottom">
      <p id="hint">Shake the wand to open a star — or just continue.</p>
      <button id="continue-btn" class="continue" type="button">Continue →</button>
    </div>
  </main>

  <!-- Hidden until you open a star -->
  <div id="compose-overlay">
    <div id="compose">
      <button id="compose-close" type="button" aria-label="Close">×</button>
      <div class="field">
        <label>Thoughts</label>
        <div id="thought-chips"></div>
        <input id="thought-input" type="text" autocomplete="off" placeholder="What's on your mind? (press Enter to add)" />
      </div>
      <div class="field">
        <label>Body</label>
        <div class="bodymap">
          <div class="bodymap-fig" id="body-fig">
            <img id="body-img" src="images/body.png" alt="" draggable="false" />
            <div id="body-dots"></div>
          </div>
          <div class="bodymap-side">
            <p id="body-hint" class="bodymap-hint">Hover the rabbit — tap a glowing point (up to 3).</p>
            <div id="body-tags"></div>
          </div>
        </div>
      </div>
      <div class="field">
        <label>Mood</label>
        <div id="circumplex">
          <div class="cx-grid">
            <div class="cx-cell" data-q="tl"></div>
            <div class="cx-cell" data-q="tr"></div>
            <div class="cx-cell" data-q="bl"></div>
            <div class="cx-cell" data-q="br"></div>
          </div>
          <span class="cx-axis-v" aria-hidden="true"></span>
          <span class="cx-axis-h" aria-hidden="true"></span>
          <img class="cx-ico cx-ico-top" src="images/sun.png" alt="high arousal" title="high arousal" />
          <img class="cx-ico cx-ico-bottom" src="images/moon.png" alt="low arousal" title="low arousal" />
          <img class="cx-ico cx-ico-left" src="images/cactus.png" alt="unpleasant" title="unpleasant" />
          <img class="cx-ico cx-ico-right" src="images/lily.png" alt="pleasant" title="pleasant" />
        </div>
      </div>
      <button id="save-btn" class="continue" type="button">Save ✨</button>
    </div>
  </div>

  <img id="wand" alt="" draggable="false" />
  <div id="twinkle"></div>

  <script src="breaks-common.js"></script>
  <script src="reflections-common.js"></script>
  <script src="skymap.js"></script>
  <script src="reflect.js"></script>
</body>
</html>
