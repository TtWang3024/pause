<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Break</title>
  <link rel="stylesheet" href="break.css?v=3" />
<link rel="stylesheet" href="gentle-progress.css">
</head>
<body>
  <main id="stage">
    <p id="label">On a break</p>
    <p id="message"></p>
    <p id="timeline">A little space to rest.</p>
    <!-- Chosen from the end-of-session questions: the length is picked here. -->
    <div id="pick-len" class="hidden">
      <p id="pick-len-hint">How long a break?</p>
      <div id="pick-len-row">
        <button class="pick-btn" type="button" data-m="3">3 min</button>
        <button class="pick-btn" type="button" data-m="10">10 min</button>
        <button class="pick-btn" type="button" data-m="30">30 min</button>
      </div>
    </div>
    <div id="progress" role="img" aria-label="Break progress"><span id="progress-fill"></span></div>
    <p id="spent-line" class="hidden"></p>

    <!-- Late in the evening, a break is a good moment to stop for the night. -->
    <div id="sleep-card" class="hidden">
      <img id="sleep-moon" src="images/moon.png" alt="" />
      <p id="sleep-line"></p>
    </div>

    <!-- The urge wave keeps going through the break: same entry, same curve. -->
    <div id="urge-wave" class="hidden">
      <p id="uw-prompt">How strong is the urge now? Tap a number to add a point.</p>
      <div id="uw-row">
        <div id="uw-lvls">
          <button class="uw-lvl" type="button" data-v="10">10</button>
          <button class="uw-lvl" type="button" data-v="8">8</button>
          <button class="uw-lvl" type="button" data-v="6">6</button>
          <button class="uw-lvl" type="button" data-v="4">4</button>
          <button class="uw-lvl" type="button" data-v="2">2</button>
          <button class="uw-lvl" type="button" data-v="0">0</button>
        </div>
        <svg id="uw-chart" viewBox="0 0 400 140">
          <defs><linearGradient id="uw-grad" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="134"><stop offset="0" stop-color="#1d4f86"/><stop offset="1" stop-color="#9cc7ee"/></linearGradient></defs>
          <g id="uw-grid"></g>
          <path id="uw-path"/>
          <g id="uw-dots"></g>
        </svg>
      </div>
    </div>

    <div id="rating">
      <p id="rating-prompt">Did this give you what you came for?</p>
      <div id="rating-opts">
        <button class="rate-opt" type="button" data-v="-1"><span class="rate-glyph">○</span>Not really</button>
        <button class="rate-opt" type="button" data-v="0"><span class="rate-glyph">◐</span>Some of it</button>
        <button class="rate-opt" type="button" data-v="1"><span class="rate-glyph">●</span>Yes, that</button>
      </div>
    </div>

    <div id="pick-row">
      <p id="pick-hint">Pick up to 3 things to do</p>
      <button id="add-reveal" type="button">+ Add an activity</button>
    </div>
    <!-- The board: area pills on top filter one field of activity pills tinted by area. -->
    <div id="activity-board">
      <div id="tag-bar" class="hidden"></div>
      <div id="activity-list"></div>
    </div>
    <div id="add-custom" class="hidden">
      <input id="custom-name" type="text" placeholder="something else…" autocomplete="off" spellcheck="false" />
      <input id="custom-tag" type="text" placeholder="tag" autocomplete="off" spellcheck="false" />
      <button id="custom-add" title="Add and select">+</button>
    </div>

    <!-- The back door (ported from the Android app): on every break; the
         lock and hold lengths are set in Options. The break itself ends at 00:00. -->
    <div id="end-row">
      <button id="return-btn" class="hidden" type="button">Hold to return</button>
      <div id="return-progress" class="quiet-progress hidden" role="img" aria-label="Hold progress"><span id="return-progress-fill"></span></div>
    </div>
  </main>

  <script src="breaks-common.js"></script>
  <script src="reflections-common.js"></script>
  <script src="break.js"></script>
  <script src="experiment-launch.js"></script>
</body>
</html>
